name: Maven Verify

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    name: Clean and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify project
        run: mvn -B clean verify
