name: Maven Publish

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '25'
  VERSIONS_MAVEN_PLUGIN_VERSION: '2.20.1'

jobs:

  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.version.outputs.branch }}
      release_version: ${{ steps.version.outputs.release_version }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
      create_release_commit: ${{ steps.version.outputs.create_release_commit }}
      release_commit: ${{ steps.release_ref.outputs.release_commit }}

    steps:
      - name: Require a branch workflow run
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "Run this workflow from the branch that should receive the release commits."
            exit 1
          fi

      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Calculate release versions
        id: version
        shell: bash
        run: |
          current_version="$({
            ./mvnw --quiet --no-transfer-progress help:evaluate \
              -Dexpression=project.version \
              -DforceStdout
          } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$' | tail -n 1)"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-SNAPSHOT)?$ ]]; then
            echo "Expected project version x.y.z-SNAPSHOT or x.y.z, found: $current_version"
            exit 1
          fi

          release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          next_version="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0-SNAPSHOT"
          tag="v${release_version}"

          if [[ "$current_version" == *-SNAPSHOT ]]; then
            if git rev-parse --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag already exists while the branch is still at $current_version."
              exit 1
            fi
            create_release_commit=true
          else
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
            if [ -n "$tag_commit" ] && [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              echo "Version $current_version is already a release, but existing tag $tag does not point to HEAD."
              exit 1
            fi
            echo "Release commit already exists; resuming the release."
            create_release_commit=false
          fi

          if ! grep -q "^## ${release_version}$" RELEASE_NOTES.md; then
            echo "RELEASE_NOTES.md must contain a '## ${release_version}' heading."
            exit 1
          fi

          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_release_commit=$create_release_commit" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.version.outputs.create_release_commit == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:${VERSIONS_MAVEN_PLUGIN_VERSION}:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "release: $RELEASE_VERSION"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Export release commit
        id: release_ref
        shell: bash
        run: echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show environment
        run: |
          java -version
          ./mvnw -version

      - name: Build JAR
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Collect JAR
        shell: bash
        run: |
          mkdir -p release

          find target -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "original-*.jar" \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "No JAR artifact found."
            exit 1
          fi

          echo "JAR artifacts:"
          ls -lah release

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: release/*
          if-no-files-found: error


  build-native-linux:
    name: Native Image - Linux
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show environment
        run: |
          java -version
          native-image --version
          ./mvnw -version

      - name: Build Linux Native Image
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean -Pnative native:compile

      - name: Collect Linux Native Image
        shell: bash
        run: |
          mkdir -p release

          echo "Target contents:"
          find target -maxdepth 2 -type f -print

          find target -maxdepth 1 \
            -type f \
            -executable \
            ! -name "*.jar" \
            ! -name "*.so" \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "No Linux native executable found."
            exit 1
          fi

          for file in release/*; do
            filename="$(basename "$file")"
            mv "$file" "release/${filename}-linux-x64"
          done

          ls -lah release

      - name: Upload Linux Native Image
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: release/*
          if-no-files-found: error


  build-native-windows:
    name: Native Image - Windows
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show environment
        shell: pwsh
        run: |
          java -version
          native-image --version
          ./mvnw -version

      - name: Build Windows Native Image
        shell: pwsh
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean -Pnative native:compile

      - name: Collect Windows Native Image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Write-Host "Target contents:"
          Get-ChildItem target -Recurse

          $nativeExecutables = Get-ChildItem target -File -Filter *.exe

          if ($nativeExecutables.Count -eq 0) {
              throw "No Windows native executable found."
          }

          foreach ($file in $nativeExecutables) {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)

              Copy-Item `
                  $file.FullName `
                  "release/$name-windows-x64.exe"
          }

          Get-ChildItem release

      - name: Upload Windows Native Image
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: release/*
          if-no-files-found: error


  build-desktop-linux:
    name: Desktop Application - Linux
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show environment
        run: |
          java -version
          jpackage --version
          ./mvnw -version

      - name: Build Linux Desktop Application
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify -Pdesktop

      - name: Collect Linux Desktop Package
        shell: bash
        run: |
          if [ ! -d target/dist ]; then
            echo "target/dist does not exist"
            exit 1
          fi

          echo "Desktop output:"
          find target/dist -maxdepth 4 -type f -print

          mkdir -p release

          tar \
            -czf release/fm-ai-assistent-desktop-linux-x64.tar.gz \
            -C target/dist .

          ls -lah release

      - name: Upload Linux Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release/*
          if-no-files-found: error


  build-desktop-windows:
    name: Desktop Application - Windows
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Show environment
        shell: pwsh
        run: |
          java -version
          jpackage --version
          ./mvnw -version

      - name: Build Windows Desktop Application
        shell: pwsh
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify -Pdesktop

      - name: Collect Windows Desktop Package
        shell: pwsh
        run: |
          if (!(Test-Path target/dist)) {
              throw "target/dist does not exist"
          }

          Write-Host "Desktop output:"
          Get-ChildItem target/dist -Recurse

          New-Item -ItemType Directory -Force -Path release | Out-Null

          Compress-Archive `
              -Path "target/dist/FM AI Assistent" `
              -DestinationPath release/fm-ai-assistent-desktop-windows-x64.zip

          Get-ChildItem release

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release/*
          if-no-files-found: error


  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - prepare-release
      - build-jar
      - build-native-linux
      - build-native-windows
      - build-desktop-linux
      - build-desktop-windows

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$tag_commit" ]; then
            if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "Existing tag $RELEASE_TAG points to $tag_commit instead of $RELEASE_COMMIT."
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists; continuing."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Verify release notes
        shell: bash
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md does not exist for tag ${{ needs.prepare-release.outputs.tag }}"
            exit 1
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is empty"
            exit 1
          fi

          echo "Using release notes:"
          cat RELEASE_NOTES.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Show downloaded artifacts
        shell: bash
        run: |
          find release-artifacts -type f -print

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release

          find release-artifacts \
            -type f \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "No release artifacts found."
            exit 1
          fi

          echo
          echo "Final GitHub Release artifacts:"
          ls -lah release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ needs.prepare-release.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release ${{ needs.prepare-release.outputs.tag }} already exists; continuing."
          else
            gh release create "${{ needs.prepare-release.outputs.tag }}" \
              release/* \
              --title "${{ needs.prepare-release.outputs.tag }}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi

  start-next-development-version:
    name: Start next minor development version
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - publish-release

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.branch }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Commit next minor snapshot version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          NEXT_VERSION: ${{ needs.prepare-release.outputs.next_version }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
        run: |
          current_version="$({
            ./mvnw --quiet --no-transfer-progress help:evaluate \
              -Dexpression=project.version \
              -DforceStdout
          } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)"

          if [ "$current_version" != "$RELEASE_VERSION" ]; then
            echo "Expected branch version $RELEASE_VERSION, found: $current_version"
            exit 1
          fi

          ./mvnw --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:${VERSIONS_MAVEN_PLUGIN_VERSION}:set \
            -DnewVersion="$NEXT_VERSION" \
            -DgenerateBackupPoms=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: start $NEXT_VERSION"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
