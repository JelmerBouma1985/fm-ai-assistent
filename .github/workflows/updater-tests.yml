name: Desktop updater tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/update/**'
      - 'src/main/java/**/desktop/**'
      - 'scripts/updater/**'
      - 'pom.xml'
      - '.github/workflows/updater-tests.yml'
permissions:
  contents: read
jobs:
  transactions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Manifest, extraction, process and recovery tests
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress -Dvaadin.skip=true '-Dtest=UpdateTest,UpdaterTransactionTest,ArchiveStagerTest,GitHubReleaseSourceTest,ArchitectureTest' test
      - name: Offline packaging script tests
        run: python -m unittest discover -s scripts/updater
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-tests-${{ matrix.os }}
          path: target/surefire-reports/
  packaged-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: transactions
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build two actual app-images without publishing
        shell: bash
        run: python scripts/updater/updater_tools.py build --output-directory '${{ runner.temp }}/updater-builds'
      - name: Packaged success and checksum rejection
        shell: bash
        run: |
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          for scenario in success checksum; do
            failure=()
            if [ "$scenario" = checksum ]; then failure=(--failure checksum); fi
            "${prefix[@]}" python scripts/updater/updater_tools.py test \
              --old-image '${{ runner.temp }}/updater-builds/old/target/dist/FM AI Assistent' \
              --new-image '${{ runner.temp }}/updater-builds/new/target/dist/FM AI Assistent' \
              --sandbox "${{ runner.temp }}/updater-$scenario" --automated --wait "${failure[@]}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-packaged-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/updater-builds/*-build.log
            ${{ runner.temp }}/updater-*/original-app.log
            ${{ runner.temp }}/updater-*/profile/.fm-ai-assistent/updater/*/*.log
            ${{ runner.temp }}/updater-*/profile/.fm-ai-assistent/updater/*/*.properties
          include-hidden-files: true
