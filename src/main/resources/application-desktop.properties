# Desktop packaging is a local single-user mode. Keep the HTTP and MCP endpoints off the LAN.
server.address=127.0.0.1
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# A desktop executable may be launched without a visible terminal, so retain diagnostics in a user log.
logging.file.name=${user.home}/.fm-ai-assistent/fm-ai-assistent.log
