spring.application.name=fm-ai-assistent
server.port=8080
# The embedded local agents can execute tools; do not expose this UI to the network by default.
server.address=127.0.0.1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false

spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.1.0-SNAPSHOT}
# Stateless Streamable HTTP is compatible with both Codex and Antigravity's local MCP clients.
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.instructions=Check fm26_get_data_status before decisions when snapshot freshness matters. Use fm26_analyze_squad first for squad weaknesses, fm26_transfer_shortlist for role-based recruitment, fm26_find_replacements for a specific incumbent, and fm26_compare_players only for finalists. Use FM Unique IDs as authoritative identity. Explicit price ceilings are literal; requires_sales means eligible but above the current budget. Treat asking_price=null and wage demands as unknown, current salary as current salary only, and estimated_willingness as a low-confidence heuristic unless recruitment_evidence says otherwise. User/game evidence recorded with fm26_update_recruitment_case overrides heuristics. Money values are raw pounds. fm26_plan_squad_moves is a read-only scenario and never changes FM26. For an importable player shortlist, select final players first and call fm26_create_shortlist_file with player_unique_id values; it creates a player-shortlist FMF, never a tactic.

# Uses the locally installed and authenticated Codex CLI. No API key is read or stored.
app.codex.enabled=true
app.codex.executable=codex
app.codex.working-directory=.
app.codex.startup-timeout=20s
app.codex.request-timeout=20s
app.codex.shutdown-timeout=5s

# Uses the locally installed and authenticated Antigravity CLI. No Google credentials are read or stored.
app.ai.antigravity.enabled=true
app.ai.antigravity.executable=agy
app.ai.antigravity.working-directory=.
app.ai.antigravity.print-timeout=15m
app.ai.antigravity.shutdown-timeout=5s

# GitHub Copilot CLI integration. Uses local `copilot login` credentials and CLI MCP config.
app.ai.copilot.enabled=true
app.ai.copilot.executable=copilot
app.ai.copilot.working-directory=.
app.ai.copilot.startup-timeout=30s
app.ai.copilot.shutdown-timeout=8s
app.ai.copilot.permission-timeout=5m

# Optional FM26 tactic context. Uploaded FMF tactic data is decrypted and decoded locally.
app.ai.tactic-context.max-file-size=20MB
app.ai.tactic-context.max-context-characters=16000
