spring.application.name=fm-ai-assistent
server.port=8080
# The embedded local agents can execute tools; do not expose this UI to the network by default.
server.address=127.0.0.1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.show-sql=false

spring.ai.mcp.server.name=fm-ai-assistent
spring.ai.mcp.server.version=${project.version:0.1.0-SNAPSHOT}
# Stateless Streamable HTTP is compatible with both Codex and Antigravity's local MCP clients.
spring.ai.mcp.server.protocol=stateless
spring.ai.mcp.server.instructions=For recruitment advice, call fm26_transfer_shortlist first with managingClub, position and explicit user constraints. Its compact ranked response already includes club finances, current position options, affordability, estimated willingness and optional role fit. Do not call fm26_find_players, fm26_get_club_context or fm26_get_player_details first. Use fm26_get_player_details only for final candidates that need full attributes. Treat asking_price=null as unknown, not free, and willingness as an estimate. Money values are raw pounds.

# Uses the locally installed and authenticated Codex CLI. No API key is read or stored.
app.codex.enabled=true
app.codex.executable=codex
app.codex.working-directory=.
app.codex.startup-timeout=20s
app.codex.request-timeout=20s
app.codex.shutdown-timeout=5s

# Uses the locally installed and authenticated Antigravity CLI. No Google credentials are read or stored.
app.ai.antigravity.enabled=true
app.ai.antigravity.executable=agy
app.ai.antigravity.working-directory=.
app.ai.antigravity.print-timeout=15m
app.ai.antigravity.shutdown-timeout=5s
